name: Feature request
description: 提出一个新功能或课程改进
title: "[Feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述“要解决什么问题”，再描述“希望怎么实现”。这能帮助我们判断方案是否真的解决问题。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
      placeholder: "初学者在实验 02 中分不清 merge commit 的两个父提交……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 课程脚本
        - 提交图 / 交互
        - 可访问性
        - 文档
        - 构建 / CI
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: 你是否愿意提交 PR？
      options:
        - label: 愿意，我可以按讨论后的方案实现
